
steps:
  # 1. Install dependencies
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']
  
  # 2. Build the app
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']
    env:
      - 'VITE_API_URL=${_VITE_API_URL}'

  # 3. Build Docker image using the Dockerfile.simple (since dist is now created in workspace)
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-f', 'Dockerfile.simple',
      '-t', 'gcr.io/$PROJECT_ID/fabric-admin-panel:latest', 
      '.'
    ]

  # 4. Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/fabric-admin-panel:latest']

images:
  - 'gcr.io/$PROJECT_ID/fabric-admin-panel:latest'

substitutions:
  _VITE_API_URL: "https://your-backend-url.run.app"

options:
  machineType: 'E2_HIGHCPU_8'
